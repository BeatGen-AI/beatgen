[project]
name = "backend"
version = "0.1.0"
description = "BeatGen API (FastAPI app, package app2, entrypoint app2.main:app)"
readme = "README.md"
requires-python = ">=3.12"
# Single declared list of direct runtime dependencies. Exact versions live in
# uv.lock; requirements.txt is generated from it (see the header of that file).
dependencies = [
    # Web framework / server
    "fastapi>=0.165.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.3",
    "email-validator>=2.4.0",
    "python-dotenv>=1.2.4",
    # Database
    "sqlmodel>=0.0.50",
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32.0",
    # Supabase (auth, storage), Stripe, Redis, Sentry
    "supabase>=2.34.1",
    "stripe>=17.1.0",
    "redis>=8.1.0",
    "sentry-sdk>=2.75.0",
    # HTTP clients, auth helpers, utilities
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=50.0.2",
    "cachetools>=8.0.2",
    "python-dateutil>=4.0.0",
    "google-auth>=2.62.2",
    # LLM assistant
    "pydantic-ai-slim[anthropic,google,openai]>=2.71.0",
    "anthropic>=2.10.0",
    "openai>=3.55.1",
    "json-repair>=0.64.9",
    # Audio / music generation
    "fal-client>=1.0.3",
    "music21>=10.5.2",
    "mido>=1.3.3",
    "mutagen>=1.48.1",
    "pydub>=0.25.1",
    # Used by backend/scripts/add_drumkits.py
    "librosa>=1.0.1",
    "numpy>=2.5.5",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
